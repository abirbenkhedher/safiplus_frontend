# ✅ Contrôles automatiques à chaque envoi (push) et demande de fusion (pull request)
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer
        run: npm ci

      - name: Lint (0 erreur exigée)
        run: npm run lint

      - name: Tests (calculs identiques au serveur, montants en lettres…)
        run: npm test

      - name: Compilation
        run: npm run build
